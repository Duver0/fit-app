version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: fit-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fit-network

  redis:
    image: redis:7-alpine
    container_name: fit-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fit-network

  api:
    image: ghcr.io/duver0/fit-app-api:latest
    container_name: fit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://duver0.github.io}
      PORT: 4000
      UPLOAD_DIR: /app/uploads
      APP_URL: https://dbfitapp.duckdns.org
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    networks:
      - fit-network

  duckdns:
    image: linuxserver/duckdns:latest
    container_name: fit-duckdns
    restart: unless-stopped
    environment:
      - SUBDOMAINS=dbfitapp
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false
    networks:
      - fit-network

  nginx:
    image: nginx:1.25-alpine
    container_name: fit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/app/uploads:ro
    depends_on:
      - api
    networks:
      - fit-network

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  fit-network:
    driver: bridge
