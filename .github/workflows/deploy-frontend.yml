name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web
        run: npm run build:web -w apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://fit-app-api-3zds.onrender.com/graphql' }}
          EXPO_PUBLIC_BASE_URL: /fit-app/
          PUBLIC_URL: /fit-app/
          NODE_ENV: production

      - name: Setup SPA routing, PWA assets, and fix asset paths for GitHub Pages
        run: |
          cd apps/mobile/dist

          # -------------------------------------------------------
          # 1. PWA: Copy service worker from source
          #    Metro bundler does NOT copy public/ directory automatically.
          # -------------------------------------------------------
          if [ -f ../public/sw.js ]; then
            echo "Copying service worker"
            cp ../public/sw.js sw.js
          else
            echo "Generating service worker"
            node -e "
              const sw = \`
        const CACHE_NAME = 'fit-app-v1'
        self.addEventListener('install', (e) => { self.skipWaiting() })
        self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()) })
        self.addEventListener('fetch', (e) => {
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)))
        })
        \`.trim()
              require('fs').writeFileSync('sw.js', sw)
            "
          fi

          # -------------------------------------------------------
          # 2. PWA: Copy icon assets for manifest
          #    Expo web build with Metro does NOT always copy icon.png to dist/assets.
          #    Try assets/ first, then fall back to project-root img/.
          # -------------------------------------------------------
          mkdir -p assets
          ICON_SRC=""
          if [ -f ../assets/icon.png ]; then
            ICON_SRC="../assets/icon.png"
          elif [ -f ../../img/icon.png ]; then
            ICON_SRC="../../img/icon.png"
          fi
          if [ -n "$ICON_SRC" ]; then
            echo "Copying PWA icons from $ICON_SRC"
            cp "$ICON_SRC" assets/icon-192x192.png
            cp "$ICON_SRC" assets/icon-512x512.png
          else
            echo "WARNING: No icon source found for PWA manifest"
          fi

          # -------------------------------------------------------
          # 3. Generate manifest.json with correct subpath-aware paths
          # -------------------------------------------------------
          echo "Generating manifest.json"
          node -e "
            const m = {
              name: 'Fit App',
              short_name: 'Fit App',
              description: 'Tu ranking de gimnasio',
              start_url: '/fit-app/',
              scope: '/fit-app/',
              display: 'standalone',
              orientation: 'portrait',
              background_color: '#FFF8F0',
              theme_color: '#FF6B35',
              lang: 'es-ES',
              icons: [
                { src: '/fit-app/assets/icon-192x192.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                { src: '/fit-app/assets/icon-512x512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
              ],
            }
            require('fs').writeFileSync('manifest.json', JSON.stringify(m, null, 2))
          "

          # -------------------------------------------------------
          # 4. Inject PWA meta/link tags into HTML files
          # -------------------------------------------------------
          for f in $(find . -name "*.html"); do
            echo "Fixing $f"
            # Add <base href="/fit-app/"> after <head>
            sed -i 's|<head>|<head><base href="/fit-app/">|' "$f"
            # Add manifest link
            if ! grep -q 'rel="manifest"' "$f"; then
              sed -i 's|</head>|<link rel="manifest" href="/fit-app/manifest.json" /></head>|' "$f"
            fi
            # Add apple-touch-icon
            if ! grep -q 'apple-touch-icon' "$f"; then
              sed -i 's|</head>|<link rel="apple-touch-icon" href="/fit-app/assets/icon-192x192.png" /></head>|' "$f"
            fi
            # Add theme-color meta
            if ! grep -q 'theme-color' "$f"; then
              sed -i 's|</head>|<meta name="theme-color" content="#FF6B35" /></head>|' "$f"
            fi
            # Add apple-mobile-web-app-capable meta
            if ! grep -q 'apple-mobile-web-app-capable' "$f"; then
              sed -i 's|</head>|<meta name="apple-mobile-web-app-capable" content="yes" /></head>|' "$f"
            fi
            # Add apple-mobile-web-app-status-bar-style meta
            if ! grep -q 'apple-mobile-web-app-status-bar-style' "$f"; then
              sed -i 's|</head>|<meta name="apple-mobile-web-app-status-bar-style" content="default" /></head>|' "$f"
            fi
            # Make asset paths relative to the base
            sed -i 's|src="/_expo|src="./_expo|g' "$f"
            sed -i 's|href="/_expo|href="./_expo|g' "$f"
            sed -i 's|href="/assets|href="./assets|g' "$f"
            # Fix favicon path: /favicon.ico -> favicon.ico (relative, resolves via <base>)
            sed -i 's|href="/favicon.ico"|href="favicon.ico"|g' "$f"
          done

          # -------------------------------------------------------
          # 5. Fix JS bundle asset paths for GitHub Pages subpath
          # -------------------------------------------------------
          for f in $(find ./_expo -name "*.js"); do
            echo "Fixing asset paths in $f"
            sed -i 's|httpServerLocation:"/assets|httpServerLocation:"/fit-app/assets|g' "$f"
          done

          # -------------------------------------------------------
          # 6. SPA: serve index.html on 404 so client-side routing works
          # -------------------------------------------------------
          cp index.html 404.html
          touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
