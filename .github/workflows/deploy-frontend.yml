name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web
        run: npm run build:web -w apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://fit-app-api-3zds.onrender.com/graphql' }}
          EXPO_PUBLIC_BASE_URL: /fit-app/
          PUBLIC_URL: /fit-app/
          NODE_ENV: production

      - name: Setup SPA routing and fix asset paths for GitHub Pages
        run: |
          cd apps/mobile/dist

          # Fix HTML files
          for f in $(find . -name "*.html"); do
            echo "Fixing $f"
            # Add <base href="/fit-app/"> after <head>
            sed -i 's|<head>|<head><base href="/fit-app/">|' "$f"
            # Add manifest link if not present (Expo should generate it, but ensure it's there)
            if ! grep -q 'rel="manifest"' "$f"; then
              sed -i 's|</head>|<link rel="manifest" href="/fit-app/manifest.json" /></head>|' "$f"
            fi
            # Add apple-touch-icon
            if ! grep -q 'apple-touch-icon' "$f"; then
              sed -i 's|</head>|<link rel="apple-touch-icon" href="/fit-app/assets/icon.png" /></head>|' "$f"
            fi
            # Make asset paths relative to the base
            sed -i 's|src="/_expo|src="./_expo|g' "$f"
            sed -i 's|href="/_expo|href="./_expo|g' "$f"
            sed -i 's|href="/assets|href="./assets|g' "$f"
          done

          # Fix JS bundle: Metro does NOT respect publicPath for asset httpServerLocation,
          # so it generates "/assets/..." instead of "/fit-app/assets/...". On GitHub Pages
          # subpath, new URL("/assets/...", bundleUrl) resolves to origin + "/assets/..."
          # (ignoring subpath). We patch it to include the subpath explicitly.
          for f in $(find ./_expo -name "*.js"); do
            echo "Fixing asset paths in $f"
            sed -i 's|httpServerLocation:"/assets|httpServerLocation:"/fit-app/assets|g' "$f"
          done

          # Fix manifest.json asset paths (if generated by Expo)
          if [ -f manifest.json ]; then
            echo "Fixing manifest.json"
            sed -i 's|"/assets|"/fit-app/assets|g' manifest.json
            sed -i 's|"src": "/|"src": "/fit-app/|g' manifest.json
          fi

          # Generate a basic manifest.json if Expo didn't create one
          if [ ! -f manifest.json ]; then
            echo "Generating manifest.json"
            node -e "
              const m = {
                name: 'Fit App',
                short_name: 'Fit App',
                description: 'Tu ranking de gimnasio',
                start_url: '/fit-app/',
                scope: '/fit-app/',
                display: 'standalone',
                orientation: 'portrait',
                background_color: '#FFF8F0',
                theme_color: '#FF6B35',
                lang: 'es-ES',
                icons: [
                  { src: '/fit-app/assets/icon.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
                  { src: '/fit-app/assets/icon.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                ],
              }
              require('fs').writeFileSync('manifest.json', JSON.stringify(m, null, 2))
            "
          fi

          # SPA: serve index.html on 404 so client-side routing works on all paths
          cp index.html 404.html
          touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
